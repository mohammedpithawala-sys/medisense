[project]
name = "medisense_flow"
version = "0.1.0"
description = "medisense_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.27,<2.0.0"
]

[project.scripts]
kickoff = "medisense_flow.main:kickoff"
run_crew = "medisense_flow.main:kickoff"
plot = "medisense_flow.main:plot"
run_with_trigger = "medisense_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "657e780f-3880-404c-b638-3a6f2fdd5c48"
