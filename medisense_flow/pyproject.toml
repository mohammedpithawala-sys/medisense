[project]
name = "medisense_flow"
version = "0.1.0"
description = "medisense_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "crewai[tools]>=1.15.27,<2.0.0",
    "fastapi[standard]>=0.162.5",
    "langchain-core>=1.7.7",
    "langchain-openai>=1.7.4",
    "pinecone>=10.0.0",
    "pypdf[crypto]>=5.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.20",
    "reportlab>=5.1.0",
]

[project.scripts]
kickoff = "medisense_flow.main:kickoff"
run_crew = "medisense_flow.main:kickoff"
plot = "medisense_flow.main:plot"
run_with_trigger = "medisense_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "657e780f-3880-404c-b638-3a6f2fdd5c48"

[tool.fastapi]
entrypoint = "medisense_flow.web.app:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
